<!DOCTYPE html>
<!--
    Basic Computer Simulator
    A simulator for the basic computer described in Morris Mano's
    "Computer System Architecture" (ISBN: 978-0131755635)

    Original ActionScript/Flex source by Laurens Rodriguez (2010)
    Licensed under the MIT license.
    Converted to HTML5/JavaScript.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Basic Computer Simulator</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    font-family: Arial, sans-serif;
    font-size: 12px;
    background: #ffffff;
}

/* ── Toolbar ── */
#toolbar {
    background: #e0e0e0;
    border-bottom: 2px solid #999;
    padding: 4px 6px;
}

.trow {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 4px;
    margin-bottom: 4px;
}
.trow:last-child { margin-bottom: 0; }

button {
    padding: 2px 8px;
    font-size: 12px;
    cursor: pointer;
    background: #d8d8d8;
    border: 1px solid #888;
}
button:hover { background: #c8c8c8; }
button:active { background: #b8b8b8; }

select {
    flex: 1;
    font-size: 12px;
    min-width: 0;
}

textarea {
    font-family: "Lucida Console", "Courier New", monospace;
    font-size: 12px;
    resize: none;
}

#txtProgram { flex: 4; height: 270px; }
#txtLabels  { flex: 1; height: 270px; min-width: 120px; }

.info-box {
    display: flex;
    align-items: center;
    gap: 4px;
    border: 1px solid #999;
    padding: 2px 4px;
    background: #f4f4f4;
}

.info-box input[type=text] {
    font-family: "Lucida Console", "Courier New", monospace;
    font-size: 12px;
    border: 1px inset #aaa;
    padding: 1px 2px;
}

#txtDescription { width: 160px; color: #0000cc; background: #f8f8ff; }
#txtCycles      { width: 70px;  color: #cc0000; background: #fff8f8; }
#txtInpr        { width: 48px; }
#txtMemory      { width: 70px; }

#lblMessage {
    flex: 1;
    padding: 2px 6px;
    border: 1px solid #999;
    background: #f4f4f4;
    min-height: 22px;
    font-family: "Lucida Console", "Courier New", monospace;
    font-size: 11px;
    color: #333;
    word-break: break-all;
}

/* ── Computer area ── */
#computer-area {
    display: flex;
    flex-direction: row;
    align-items: flex-start;
    padding: 12px 10px;
    gap: 10px;
    background: #ffffff;
    overflow-x: auto;
}

/* ── Register boxes ── */
.reg-group {
    display: flex;
    flex-direction: column;
    gap: 3px;
    flex-shrink: 0;
}

.reg-box {
    display: flex;
    align-items: center;
    border: 1px solid #000;
    height: 30px;
    white-space: nowrap;
}

.reg-name {
    font-family: Verdana, sans-serif;
    font-weight: bold;
    font-size: 13px;
    color: #aa0000;
    padding: 0 6px;
    min-width: 38px;
}

.reg-data {
    font-family: "Courier New", monospace;
    font-weight: bold;
    font-size: 12px;
    color: #000000;
    padding: 0 6px 0 2px;
    letter-spacing: 0.5px;
}

/* ── Memory table ── */
#mem-container {
    border: 1px solid #000;
    background: #ddeeff;
    flex-shrink: 0;
    padding-bottom: 6px;
}

#mem-title {
    font-family: Verdana, sans-serif;
    font-weight: bold;
    font-size: 14px;
    color: #aa0000;
    text-align: center;
    padding: 4px 20px 2px;
}

#mem-table {
    font-family: "Courier New", monospace;
    font-size: 12px;
    font-weight: bold;
    border-collapse: collapse;
    padding: 0 8px;
    margin: 0 6px;
}

#mem-table td {
    padding: 1px 5px;
    white-space: nowrap;
}

.mem-addr { color: #aa0000; }
.mem-hex  { color: #000099; }
.mem-bin  { color: #000000; }
</style>
</head>
<body>

<!-- ═══════════════════════════════════════════════════════ TOOLBAR ═══ -->
<div id="toolbar">

    <!-- Row 1: buttons + dropdown -->
    <div class="trow">
        <span>Program</span>
        <button id="btnAssemble">Assemble</button>
        <button id="btnLoad">Load</button>
        <button id="btnRun">Run</button>
        <button id="btnNext">Next</button>
        <span>Select example:</span>
        <select id="cmbPrograms"></select>
    </div>

    <!-- Row 2: program editor + labels -->
    <div class="trow" style="align-items:flex-start">
        <textarea id="txtProgram" spellcheck="false"></textarea>
        <textarea id="txtLabels"  spellcheck="false" readonly></textarea>
    </div>

    <!-- Row 3: description / cycles / inpr -->
    <div class="trow">
        <div class="info-box">
            <span>Description:</span>
            <input type="text" id="txtDescription" readonly>
        </div>
        <div class="info-box">
            <span>Cycles:</span>
            <input type="text" id="txtCycles" readonly>
        </div>
        <div class="info-box" style="flex:1">
            <span>Set INPR:</span>
            <input type="text" id="txtInpr">
            <button id="btnSetInpr">Set</button>
            <button id="btnSetFgo">Set FGO</button>
            <button id="btnSetFgi">Set FGI</button>
        </div>
    </div>

    <!-- Row 4: message + memory nav -->
    <div class="trow">
        <div id="lblMessage">Ready</div>
        <div class="info-box">
            <span>Memory:</span>
            <input type="text" id="txtMemory">
            <button id="btnMemory">Go</button>
        </div>
    </div>
</div>

<!-- ══════════════════════════════════════════ COMPUTER VISUALIZATION ═══ -->
<div id="computer-area">
    <div id="grp-ff"   class="reg-group"></div>   <!-- SC, I, S, E, R, IEN, FGI, FGO -->
    <div id="grp-main" class="reg-group"></div>   <!-- AR, PC, DR, AC, IR, TR, INPR, OUTR -->
    <div id="mem-container">
        <div id="mem-title">RAM</div>
        <table id="mem-table"><tbody id="mem-tbody"></tbody></table>
    </div>
</div>

<script src="src/com/ex/comp/Register.js"></script>
<script src="src/com/ex/comp/Memory.js"></script>
<script src="src/com/ex/comp/Assembler.js"></script>
<script src="src/com/ex/comp/Computer.js"></script>
<script src="src/main.js"></script>
</body>
</html>
